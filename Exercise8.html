<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Generator</title>
    <link rel="stylesheet" href="Exercise8.css">
    <script src="Exercise8.js"></script>
</head>
<body>
    <div class="cont">
        <h1>Dice Generator</h1>

        <label for="selectDice">Choose a dice to roll:</label>
        <select name="select" id="selectDice">
            <option value="4">D4</option>
            <option value="6" selected>D6</option>
            <option value="8">D8</option>
            <option value="10">D10</option>
            <option value="12">D12</option>
            <option value="20">D20</option>
        </select>
        
        <button id="rollButton" onclick="rollFromSelection()">Roll!</button>
        <div id ="result">?</div>
    </div>
</body>
</html>
